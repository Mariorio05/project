<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mario Berkah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-box">
            <h2 style="margin-bottom: 10px;">Syalom!</h2>
            <p style="margin-bottom: 30px; color: #6b5c51;">Silakan masuk ke portal jemaat Anda</p>
            
            <form action="#" method="post" style="text-align: left;">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn-gold">Masuk</button>
            </form>

            <p style="margin-top: 20px;">Belum terdaftar? <a href="register.html" style="color: #b8860b; font-weight: bold; text-decoration: none;">Daftar di sini</a></p>
            <p style="margin-top: 10px;"><a href="index.html" style="color: #999; text-decoration: none;">&larr; Kembali ke Beranda</a></p>
        </div>
    </div>

</body>
</html>
