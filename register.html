<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Mario Berkah</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-box">
            <h2 style="margin-bottom: 10px;">Pendaftaran Akun Baru</h2>
            <p style="margin-bottom: 30px; color: #6b5c51;">Bergabunglah untuk mendapatkan akses kajian khusus</p>
            
            <form action="#" method="post" style="text-align: left;">
                <div class="input-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn-gold">Daftar Sekarang</button>
            </form>

            <p style="margin-top: 20px;">Sudah punya akun? <a href="login.html" style="color: #b8860b; font-weight: bold; text-decoration: none;">Masuk</a></p>
        </div>
    </div>

</body>
</html>
